name: index_relay_probe
description: Index Relay mobile app and Android preview.
publish_to: none
version: 0.12.1+34
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - path: assets/audio-golden.json
      flavors: [preview]
    - path: assets/japanese.wav
      flavors: [preview]
    - path: assets/ggml-base.bin
      flavors: [preview, production]
    - assets/notices/
